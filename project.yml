name: BLELampen
options:
  bundleIdPrefix: com.marcel.blelampen
  deploymentTarget:
    iOS: "16.0"

targets:
  BLELampen:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcel.blelampen
        INFOPLIST_KEY_CFBundleDisplayName: BLE Lampen
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Diese App braucht Bluetooth, um die LED-Lampen zu steuern."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "Diese App braucht Bluetooth, um die LED-Lampen zu steuern."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: "bluetooth-central"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: BLELampenWidget
        embed: true

  BLELampenWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: BLELampenWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcel.blelampen.widget
        INFOPLIST_FILE: BLELampenWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
